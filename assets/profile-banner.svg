<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 550" width="1600" height="550" role="img" aria-label="Nittin Chughani: Computer Science and Engineering student, software builder, digital creator">
<title>Nittin Chughani | Software developer</title>
<desc>Midnight-blue developer banner with glowing fixed name, rotating role description and a neon workstation illustration.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070B20"/><stop offset=".6" stop-color="#0C1231"/><stop offset="1" stop-color="#100A24"/></linearGradient>
<radialGradient id="aura"><stop stop-color="#344DAD" stop-opacity=".5"/><stop offset="1" stop-color="#344DAD" stop-opacity="0"/></radialGradient>
<linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17254C"/><stop offset="1" stop-color="#0A1430"/></linearGradient>
<linearGradient id="trim" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#73B8FF"/><stop offset=".6" stop-color="#9E80FF"/><stop offset="1" stop-color="#EF80FF"/></linearGradient>
<filter id="glow" x="-80%" y="-100%" width="260%" height="300%"><feGaussianBlur stdDeviation="12"/></filter>
<filter id="soft" x="-50%" y="-100%" width="200%" height="300%"><feGaussianBlur stdDeviation="20"/></filter>
</defs>
<style>
.name{font-family:Arial,'Segoe UI',sans-serif;font-weight:900;letter-spacing:4px}
.role{font-family:Arial,'Segoe UI',sans-serif;font-size:31px;letter-spacing:1px;fill:#DAE3FF;text-anchor:middle;opacity:0;animation:rolecycle 20s linear infinite}
.role.first{animation-delay:0s}
.role.second{animation-delay:5s}
.role.third{animation-delay:10s}
.role.fourth{animation-delay:15s}
@keyframes rolecycle {0%,2%{opacity:0}5%,20%{opacity:1}24%,100%{opacity:0}}
@media(prefers-reduced-motion:reduce){.role{animation:none!important;opacity:0}.role.first{opacity:1}}
</style>
