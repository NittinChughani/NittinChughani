<svg xmlns="http://www.w3.org/2000/svg" width="600" height="220" viewBox="0 0 600 220" role="img" aria-label="TurnAhead featured open-source project">
<title>TurnAhead project</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1B2337"/><stop offset=".65" stop-color="#131B2C"/><stop offset="1" stop-color="#19182C"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#5EE1CA"/><stop offset="1" stop-color="#299C9C"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#5EE1CA" stop-opacity=".21"/><stop offset="1" stop-color="#5EE1CA" stop-opacity="0"/></radialGradient>
</defs>
<rect x="1" y="1" width="598" height="218" rx="19" fill="url(#bg)" stroke="#45516E" stroke-width="2"/>
<rect x="0" y="20" width="5" height="180" rx="2" fill="url(#accent)"/>
<circle cx="90" cy="78" r="128" fill="url(#halo)"/>
<path d="M27 19H573" stroke="#4D5A75" stroke-width="1" opacity=".65"/>
<text x="28" y="40" font-family="Arial,Segoe UI,sans-serif" font-size="11" letter-spacing="1.8" font-weight="700" fill="#5EE1CA">HEALTHCARE  /  QUEUE TOOLS</text>
<text x="559" y="40" text-anchor="end" font-family="Arial,Segoe UI,sans-serif" font-size="13" letter-spacing="1.5" font-weight="700" fill="#788BA9">02  /  03</text>
<rect x="28" y="49" width="94" height="88" rx="20" fill="#253048" stroke="#5EE1CA" stroke-opacity=".6" stroke-width="1.5"/>
<image x="40" y="58" width="69" height="69" href="data:image/png;base64," preserveAspectRatio="xMidYMid meet"/>
<text x="146" y="103" font-size="37" font-family="Arial,Segoe UI,sans-serif" fill="#F6F8FF" font-weight="800">TurnAhead</text>
<path d="M28 151H573" stroke="#465472"/>
<text x="29" y="178" font-size="19" font-family="Arial,Segoe UI,sans-serif" fill="#D3DDF0">Walk-in queues without the waiting-room guesswork.</text>
<text x="29" y="204" font-size="19" font-family="Arial,Segoe UI,sans-serif" fill="#D3DDF0">Digital tickets, live turns and staff controls.</text>
