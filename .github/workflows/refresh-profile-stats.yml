name: Refresh Profile Data

on:
  workflow_dispatch:
  schedule:
    - cron: "21 4 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/generate_profile_stats.py"
      - "scripts/update_achievements.py"
      - "scripts/language_logos.json"
      - ".github/workflows/refresh-profile-stats.yml"

permissions:
  contents: write

concurrency:
  group: profile-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate GitHub stats and languages-used logo gallery
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: NittinChughani
        run: python3 scripts/generate_profile_stats.py

      - name: Update earned milestones and official badge images in README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: NittinChughani
        run: python3 scripts/update_achievements.py

      - name: Commit any changed profile content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/github-stats.svg assets/languages-used.svg assets/achievement-milestones.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh profile stats, languages and achievements"
            git push
          fi
